<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RNOC SOUTH – Personnel Map V2</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#10222f;--panel:#f4f7f8;--line:#d3dde2;--teal:#0b7a75;--amber:#e8a317;--red:#d64545;--txt:#1b2f3c;--mut:#5d7280;--card:#fff}
@media(prefers-color-scheme:dark){:root{--panel:#16242e;--line:#2b3f4c;--card:#1d2f3b;--txt:#e4edf1;--mut:#92a7b3}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Sarabun,system-ui,sans-serif;color:var(--txt);background:var(--panel)}
#app{display:flex;height:100%}
aside{width:320px;max-width:34vw;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel)}
header{background:var(--ink);color:#fff;padding:12px 14px}
header h1{margin:0;font-size:17px}header small{color:#9fb8c4}
.box{padding:10px 14px;border-bottom:1px solid var(--line)}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);margin-top:4px}
.row{display:flex;gap:6px}.row>*{flex:1}
button{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer}
button:hover{border-color:var(--teal)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.pri{background:var(--teal);border-color:var(--teal);color:#fff}.dng{color:var(--red)}
#sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
#sum div{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px}
#sum b{display:block;font-size:22px;color:var(--teal)}#sum span{font-size:12px;color:var(--mut)}
#bars{margin-top:8px;font-size:12px}
.bar{display:flex;align-items:center;gap:6px;margin:2px 0;cursor:pointer}.bar i{display:block;height:8px;background:var(--teal);border-radius:4px}.bar em{font-style:normal;color:var(--mut)}
#list{flex:1;overflow:auto;padding:8px 14px}
.item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:6px;padding:8px 10px;margin-bottom:6px}
.item b{cursor:pointer}.item div{font-size:13px;color:var(--mut)}.item .acts{margin-top:4px;display:flex;gap:6px}.item button{padding:2px 8px;font-size:12px}
.empty{color:var(--mut);text-align:center;padding:20px 8px;font-size:14px}
#mapwrap{flex:1;position:relative}#map{height:100%}
#hint{position:absolute;z-index:500;top:10px;left:50px;background:var(--ink);color:#fff;padding:6px 12px;border-radius:20px;font-size:13px;pointer-events:none}
.tp{position:relative;width:44px;height:54px}
.tp .c{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,var(--k2),var(--k));border:3px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.45)}
.tp .c svg{width:30px;height:30px}
.tp::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);border:8px solid transparent;border-top:10px solid var(--k);border-bottom:0}
.tp b{position:absolute;top:-6px;right:-8px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--red);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.leaflet-marker-draggable{cursor:grab}
.tp.cm{--k:#1fae5b;--k2:#0d7a3c}.tp.bb{--k:#ff8a1f;--k2:#d45a00}
.tp i{position:absolute;top:-6px;left:-12px;font-style:normal;font-size:10px;font-weight:700;background:#fff;color:var(--k2);padding:1px 5px;border-radius:8px;border:1px solid var(--k2)}
.tp svg path:nth-of-type(1){fill:#10222f}.tp svg path:nth-of-type(2){stroke:#fff}.tp svg path:nth-of-type(3){fill:#fff}.tp svg rect{fill:#dfe8ec}
.tag{font-size:11px;font-weight:700;color:#fff;padding:1px 7px;border-radius:9px}.tag.cm{background:#0d9a4a}.tag.bb{background:#e8690b}
.item.cm{border-left-color:#0d9a4a}.item.bb{border-left-color:#e8690b}
#rp{width:340px;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);transition:width .2s}
#rp.closed{width:0;border:0;overflow:hidden;visibility:hidden}
#tabs{display:flex;gap:4px;padding:10px 14px 0;background:var(--ink)}
#tabs button{flex:1;border:0;border-radius:6px 6px 0 0;background:#24415a;color:#cfe0e8}
#tabs button.on{background:var(--panel);color:var(--txt);font-weight:700}
#tabs #rx{display:none;flex:0 0 40px}
#rt{position:absolute;z-index:500;top:10px;right:10px}
.leaflet-popup-content{color:#1b2f3c}
.leaflet-popup-content button{background:#e6eaed;color:#1b2f3c;border:1px solid #cbd3d8}
.leaflet-popup-content button:hover{background:#d8dee2;border-color:#aab5bc}
.leaflet-popup-content button.dng{color:#c0392b}
html,body{font-size:13px}
aside{width:250px;max-width:30vw}
header{padding:8px 10px}header h1{font-size:15px}header small{font-size:11px}
.box{padding:8px 10px}
input,select{padding:5px 7px}button{padding:4px 8px}
#sum b{font-size:18px}#sum div{padding:4px}
#list{padding:6px 8px}.item{padding:6px 8px;margin-bottom:5px}.item div{font-size:12px}
#rp{width:270px}#tabs{padding:8px 8px 0}
#rt{position:static}
#mt{position:absolute;z-index:500;top:10px;right:10px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:calc(100% - 60px)}
#mt button{box-shadow:0 2px 6px rgba(0,0,0,.3)}
button:disabled{opacity:.45;cursor:default}
.tp{width:22px;height:27px}
.tp .c{width:22px;height:22px;border-width:2px;box-shadow:0 2px 5px rgba(0,0,0,.45)}
.tp .c svg{width:15px;height:15px}
.tp::after{border-width:4px;border-top-width:5px;border-bottom-width:0}
.tp b{top:-5px;right:-7px;min-width:14px;height:14px;padding:0 3px;font-size:9px;border-width:1px;border-radius:7px}
.tp i{top:-5px;left:-9px;font-size:7px;padding:0 3px;border-radius:5px}
.tp .nm{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:7px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#fff;color:#10222f;font-size:11px;font-weight:700;line-height:1.4;padding:0 6px;border-radius:8px;border:1px solid var(--k2);box-shadow:0 1px 3px rgba(0,0,0,.3);pointer-events:none}
.tp .nm:empty{display:none}
.tp .nm{max-width:none;overflow:visible;text-overflow:clip;background:none;border:0;box-shadow:none;padding:0;border-radius:0;margin-bottom:6px;text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff,0 0 4px #fff}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;border:1px solid rgba(0,0,0,.25);vertical-align:middle}
textarea{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:inherit;font:inherit;margin-top:4px;resize:vertical}
.tp .c{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);display:block;width:auto;height:auto;min-width:22px;padding:2px 9px;border-radius:12px;border-width:2px;font-size:11px;font-weight:700;line-height:1.2;color:#fff;white-space:nowrap;text-align:center}
.tp .nm{margin-bottom:2px;text-align:center;line-height:1.25;color:#10222f;font-size:11px;font-weight:600}
#hint{font-size:12px;left:52px;max-width:calc(100% - 420px);white-space:normal}
#toast button{margin-left:8px;padding:2px 10px;background:#fff;color:#10222f;border:0;border-radius:12px}
@media(max-width:1000px){#rp{position:fixed;top:0;right:0;bottom:0;width:min(88vw,340px);z-index:1500;box-shadow:-6px 0 24px rgba(0,0,0,.4);transition:transform .2s}#rp.closed{width:min(88vw,340px);transform:translateX(105%);box-shadow:none}#tabs #rx{display:block}}
dialog{border:none;border-radius:10px;padding:16px;width:min(380px,92vw);max-height:92vh;overflow:auto;background:var(--card);color:var(--txt);box-shadow:0 10px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,30,.5)}dialog h3{margin:0 0 6px}dialog label{display:block;margin-top:8px;font-size:13px;color:var(--mut)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;display:none;z-index:2000}
#tg{display:none}
@media(max-width:760px){

</style>
</head>

</div>

$("rad").onchange=()=>render();
const TECH=`<svg viewBox="0 0 24 24"><path d="M4.5 21c0-3.8 3.2-6.2 7.5-6.2s7.5 2.4 7.5 6.2z" fill="#fff"/><path d="M10 15l2 2.6 2-2.6" fill="none" stroke="#0b7a75" stroke-width="1.4" stroke-linejoin="round"/><circle cx="12" cy="10.6" r="3" fill="#ffd9b0"/><path d="M6.8 10a5.2 5.2 0 0 1 10.4 0z" fill="#e8a317"/><rect x="5.2" y="9.6" width="13.6" height="1.8" rx=".9" fill="#c98a0a"/><rect x="11" y="3.6" width="2" height="3" rx=".6" fill="#c98a0a"/></svg>`;
function icon(c,ty,n,m){return L.divIcon({className:"",html:`<div class="tp ${ty==="3BB"?"bb":"cm"}"><div class="c"><span>${esc(n||"")}</span><i>${ty==="3BB"?"3BB":"CM"}</i><b>${c}</b></div><span class="nm">${(m||"").split(/[\n,]+/).map(s=>s.trim()).filter(Boolean).map(esc).join("<br>")}</span></div>`,iconSize:[22,27],iconAnchor:[11,27],popupAnchor:[0,-27]})}
const ph=r=>"📞 "+([r.tel,r.tel2].filter(Boolean).map(t=>`<a href="tel:${esc(t.replace(/[^\d+]/g,""))}">${esc(t)}</a>`).join(" · ")||"-");
const rkm=r=>r.rk==null?3:r.rk;
const acol=r=>{let h=0;for(const c of(r.a||r.n||""))h=(h*131+c.charCodeAt(0))%360;return`hsl(${h},70%,55%)`};
const tag=r=>`<span class="tag ${r.ty==="3BB"?"bb":"cm"}">${r.ty==="3BB"?"3BB":"CM"}</span>`;
function copyLL(id){const r=data.find(x=>x.id===id);if(!r)return;const s=r.lat.toFixed(6)+", "+r.lng.toFixed(6);
 (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast("คัดลอกพิกัดแล้ว: "+s)).catch(()=>prompt("คัดลอกพิกัด",s))}
function render(){
 const f=filtered();
 if(alayer)map.removeLayer(alayer);alayer=L.layerGroup().addTo(map);
 if($("sa").checked){const own={};
  f.forEach(r=>covI(r).forEach(i=>{if(!own[i]||DP[i][3]===r.d)own[i]=r}));
  for(const i in own){const r=own[i],c=acol(r);L.polygon(gll(i),{color:c,weight:2,opacity:.75,fillColor:c,fillOpacity:.2}).bindTooltip("อ."+DP[i][3]+" · "+esc(r.n),{sticky:true}).addTo(alayer)}}
 if(qlayer){map.removeLayer(qlayer);qlayer=null}
 const qm=$("q").value.trim().match(LLRE);
 if(qm&&Math.abs(+qm[1])<=90&&Math.abs(+qm[2])<=180){
  const la=+qm[1],ln=+qm[2],km=+$("rad").value,c=L.circle([la,ln],{radius:km*1000,color:"#e8a317",weight:2,fillOpacity:.08});
  qlayer=L.layerGroup([c,L.circleMarker([la,ln],{radius:6,color:"#d64545",fillOpacity:1})]).addTo(map);
  const key=la+","+ln+","+km;if(key!==lastQ){lastQ=key;map.fitBounds(c.getBounds())}
 }else lastQ="";
 for(const id in markers){map.removeLayer(markers[id]);delete markers[id]}
 f.forEach(r=>{
  const m=L.marker([r.lat,r.lng],{draggable:true,icon:icon(r.c,r.ty,r.n,r.m)}).addTo(map);
  m.bindPopup(()=>`<b>${esc(r.n)}</b> ${tag(r)}<br>👥 ${esc((r.m||"-").replace(/\n/g,", "))}<br>🗺️ พื้นที่ดูแล: <span class="dot" style="background:${acol(r)}"></span>${esc(r.a||"-")}<br>🔲 อำเภอที่ครอบคลุม: ${covI(r).map(i=>DP[i][3]).join(", ")||"-"}<br>💼 ${esc(r.t||"-")}<br>${ph(r)}<br>${esc(r.p)} / ${esc(r.d||"-")}<br>📍 ${r.lat.toFixed(5)}, ${r.lng.toFixed(5)} <button onclick="copyLL('${r.id}')">คัดลอก</button><br>จำนวน <button onclick="chg('${r.id}',-1)">−</button> <b>${r.c}</b> <button onclick="chg('${r.id}',1)">＋</button> คน<br><button onclick="openForm('${r.id}')">✏️ แก้ไข</button> <button class="dng" onclick="del('${r.id}')">🗑️ ลบ</button>`);
  m.on("dblclick",()=>{chg(r.id,1);toast("เพิ่มเป็น "+r.c+" คน",1)});
  m.on("dragend",()=>{const ll=m.getLatLng();r.lat=ll.lat;r.lng=ll.lng;const lc=locate(ll);let msg="ย้ายตำแหน่งแล้ว";if(lc&&(lc.p!==r.p||lc.d!==r.d)){r.p=lc.p;r.d=lc.d;msg="ย้ายแล้ว → จ."+lc.p+" อ."+lc.d}save();render();markers[r.id].openPopup();toast(msg,1)});
  markers[r.id]=m;
 });
 $("s1").textContent=f.reduce((s,r)=>s+r.c,0);
 $("s2").textContent=new Set(f.map(r=>r.p)).size;
 $("s3").textContent=new Set(f.map(r=>r.p+"|"+r.d)).size;
 const tn=t=>f.filter(r=>r.ty===t).reduce((s,r)=>s+r.c,0);
 $("tc").innerHTML=`<span class="tag cm">CM</span> ${tn("CM")} คน &nbsp; <span class="tag bb">3BB</span> ${tn("3BB")} คน`;
 $("rt").textContent="📋 จำนวนทีมช่างทั้งหมด "+data.length+" ทีม";
 const bp={};f.forEach(r=>bp[r.p]=(bp[r.p]||0)+r.c);
 const mx=Math.max(1,...Object.values(bp));
 $("bars").innerHTML=Object.entries(bp).sort((a,b)=>b[1]-a[1]).map(([p,n])=>`<div class="bar" data-p="${p}"><span style="min-width:90px">${p}</span><i style="width:${n/mx*100}px"></i><em>${n}</em></div>`).join("");
 document.querySelectorAll(".bar").forEach(b=>b.onclick=()=>{$("fp").value=b.dataset.p;$("fp").onchange()});
 $("list").innerHTML=f.length?f.map(r=>`<div class="item ${r.ty==="3BB"?"bb":"cm"}"><b data-id="${r.id}">${esc(r.n)}</b> ${tag(r)} · <button data-m="${r.id}">−</button> <b>${r.c}</b> <button data-a="${r.id}">＋</button> คน<div>👥 ${esc((r.m||"-").replace(/\n/g,", "))}<br><span class="dot" style="background:${acol(r)}"></span>🗺️ ${esc(r.a||"-")}<br>🔲 ${covI(r).map(i=>DP[i][3]).join(", ")||"-"}<br>💼 ${esc(r.t||"-")}<br>${ph(r)}<br>${esc(r.p)} / ${esc(r.d||"-")}<br>📍 ${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}${dm[r.id]!=null?` · <b style="color:var(--teal)">ห่าง ${dm[r.id].toFixed(2)} กม.</b>`:""}</div><div class="acts"><button data-e="${r.id}">✏️ แก้ไข</button><button class="dng" data-x="${r.id}">🗑️ ลบ</button></div></div>`).join("")
  :`<div class="empty">${data.length?"ไม่พบข้อมูลที่ตรงกับตัวกรอง":"ยังไม่มีข้อมูล – คลิกบนแผนที่เพื่อเพิ่มบุคลากรคนแรก"}</div>`;
 $("list").querySelectorAll("[data-id]").forEach(e=>e.onclick=()=>{const m=markers[e.dataset.id];if(mob())setRp(false);map.setView(m.getLatLng(),12);m.openPopup()});
 $("list").querySelectorAll("[data-m]").forEach(e=>e.onclick=()=>chg(e.dataset.m,-1));
 $("list").querySelectorAll("[data-a]").forEach(e=>e.onclick=()=>chg(e.dataset.a,1));
 $("list").querySelectorAll("[data-e]").forEach(e=>e.onclick=()=>openForm(e.dataset.e));
 $("list").querySelectorAll("[data-x]").forEach(e=>e.onclick=()=>del(e.dataset.x));
}
$("all").onclick=()=>{const f=filtered();if(!f.length){toast("ไม่มีบุคลากรให้แสดง");return}map.fitBounds(L.latLngBounds(f.map(r=>[r.lat,r.lng])),{padding:[50,50],maxZoom:13})};

$("ex").onclick=()=>{
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
 a.download="rnoc_south_personnel_"+new Date().toISOString().slice(0,10)+".json";a.click();toast("Export แล้ว");
};
$("im").onclick=()=>$("file").click();
$("file").onchange=e=>{
 const f=e.target.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{try{
  const j=JSON.parse(rd.result);if(!Array.isArray(j)||j.some(r=>typeof r.lat!=="number"||typeof r.lng!=="number"||!r.n))throw 0;
  const rep=confirm("OK = แทนที่ข้อมูลเดิมทั้งหมด\nCancel = รวมกับข้อมูลเดิม");
  const clean=j.map(r=>({id:r.id||"u"+Date.now()+Math.random().toString(36).slice(2,6),lat:r.lat,lng:r.lng,p:r.p||"",d:r.d||"",n:String(r.n),t:String(r.t||""),tel:String(r.tel||""),tel2:String(r.tel2||""),m:String(r.m||""),a:String(r.a||""),rk:r.rk==null?3:Math.max(0,+r.rk||0),ty:r.ty==="3BB"?"3BB":"CM",c:Math.max(1,parseInt(r.c)||1)}));
  data=rep?clean:data.filter(x=>!clean.some(c=>c.id===x.id)).concat(clean);
  save();render();toast("Import "+clean.length+" รายการแล้ว");
 }catch(err){toast("ไฟล์ไม่ถูกต้อง – ต้องเป็น JSON ที่ Export จากระบบนี้")}};
 rd.readAsText(f);e.target.value="";
};
render();
const rp=$("rp"),mob=()=>matchMedia("(max-width:1000px)").matches;
function setRp(open){rp.classList.toggle("closed",!open);setTimeout(()=>map.invalidateSize(),250)}
$("rt").onclick=()=>setRp(rp.classList.contains("closed"));
$("rx").onclick=()=>setRp(false);
if(mob())rp.classList.add("closed");
$("add").onclick=()=>{pending=map.getCenter();openForm(null)};
$("ub").onclick=undo;$("rb").onclick=redo;$("sa").onchange=()=>render();updUndo();
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&!$("dlg").open&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();e.shiftKey?redo():undo()}});
setTimeout(()=>$("hint").style.display="none",9000);
document.querySelectorAll("#tabs [data-ty]").forEach(b=>b.onclick=()=>{curTy=b.dataset.ty;document.querySelectorAll("#tabs [data-ty]").forEach(x=>x.classList.toggle("on",x===b));render()});
if(data.length)setTimeout(()=>$("all").click(),300);
</script>
</body>
</html>
